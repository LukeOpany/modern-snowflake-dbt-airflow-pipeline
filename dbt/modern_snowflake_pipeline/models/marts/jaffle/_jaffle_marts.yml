version: 2

models:
  - name: fct_jaffle_orders
    description: One row per Jaffle Shop order, enriched with customer information.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle__customers')
                field: customer_id

      - name: customer_name
        data_tests:
          - not_null

      - name: ordered_at
        data_tests:
          - not_null

      - name: order_date
        data_tests:
          - not_null

      - name: store_id
        data_tests:
          - not_null

      - name: order_total_amount
        data_tests:
          - not_null
