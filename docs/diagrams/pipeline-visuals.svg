<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#475569}
      .zone{font:700 15px Inter,Arial,sans-serif;fill:#475569;letter-spacing:1.5px}
      .nodeTitle{font:700 21px Inter,Arial,sans-serif;fill:#0f172a}
      .nodeText{font:400 16px Inter,Arial,sans-serif;fill:#475569}
      .badge{font:700 14px Inter,Arial,sans-serif;fill:#0f172a}
      .metric{font:700 26px Inter,Arial,sans-serif;fill:#0f172a}
      .metricLabel{font:400 14px Inter,Arial,sans-serif;fill:#64748b}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="82" class="title">End-to-end analytics pipeline</text>
  <text x="80" y="120" class="subtitle">Generate relational order data, load Snowflake, transform with dbt, and verify every stage with Airflow.</text>

  <rect x="80" y="162" width="1440" height="108" rx="8" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <text x="112" y="195" class="zone">ORCHESTRATION PLANE</text>
  <rect x="112" y="214" width="280" height="36" rx="18" fill="#fff"/>
  <text x="142" y="238" class="badge">1  ingest_raw_data</text>
  <rect x="432" y="214" width="300" height="36" rx="18" fill="#fff"/>
  <text x="462" y="238" class="badge">2  validate_dbt_connection</text>
  <rect x="772" y="214" width="260" height="36" rx="18" fill="#fff"/>
  <text x="802" y="238" class="badge">3  run_dbt_models</text>
  <rect x="1072" y="214" width="250" height="36" rx="18" fill="#fff"/>
  <text x="1102" y="238" class="badge">4  test_dbt_models</text>
  <rect x="1362" y="208" width="126" height="48" rx="8" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
  <text x="1391" y="238" class="badge">SUCCESS</text>

  <text x="80" y="326" class="zone">DATA PLANE</text>
  <g filter="url(#shadow)">
    <rect x="80" y="354" width="218" height="174" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="108" y="396" class="nodeTitle">Synthetic CSVs</text>
    <text x="108" y="432" class="nodeText">Jaffle generator</text>
    <text x="108" y="461" class="nodeText">customers + orders</text>
    <rect x="108" y="482" width="153" height="28" rx="14" fill="#ffedd5"/>
    <text x="126" y="501" class="badge">local, gitignored</text>

    <rect x="340" y="354" width="218" height="174" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="368" y="396" class="nodeTitle">Python ingestor</text>
    <text x="368" y="432" class="nodeText">validates files</text>
    <text x="368" y="461" class="nodeText">creates stage + COPY</text>
    <text x="368" y="490" class="nodeText">reports row counts</text>

    <rect x="600" y="354" width="218" height="174" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <text x="628" y="396" class="nodeTitle">Snowflake RAW</text>
    <text x="628" y="432" class="nodeText">RAW_CUSTOMERS</text>
    <text x="628" y="461" class="nodeText">RAW_ORDERS</text>
    <text x="628" y="490" class="nodeText">internal file stage</text>

    <rect x="860" y="354" width="218" height="174" rx="8" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
    <text x="888" y="396" class="nodeTitle">dbt staging</text>
    <text x="888" y="432" class="nodeText">standardized names</text>
    <text x="888" y="461" class="nodeText">dates + currency</text>
    <text x="888" y="490" class="nodeText">source contracts</text>

    <rect x="1120" y="354" width="218" height="174" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <text x="1148" y="396" class="nodeTitle">Analytics mart</text>
    <text x="1148" y="432" class="nodeText">FCT_JAFFLE_ORDERS</text>
    <text x="1148" y="461" class="nodeText">customer-enriched</text>
    <text x="1148" y="490" class="nodeText">one row per order</text>

    <rect x="1380" y="354" width="140" height="174" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="1408" y="396" class="nodeTitle">Quality</text>
    <text x="1408" y="432" class="nodeText">unique</text>
    <text x="1408" y="461" class="nodeText">not null</text>
    <text x="1408" y="490" class="nodeText">relationships</text>
  </g>
  <path d="M298 441 H328" class="arrow"/>
  <path d="M558 441 H588" class="arrow"/>
  <path d="M818 441 H848" class="arrow"/>
  <path d="M1078 441 H1108" class="arrow"/>
  <path d="M1338 441 H1368" class="arrow"/>

  <rect x="80" y="586" width="1440" height="158" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="112" y="620" class="zone">VERIFIED RUN · 29 JULY 2026</text>
  <g>
    <text x="130" y="678" class="metric">931</text>
    <text x="130" y="708" class="metricLabel">customers loaded</text>
    <line x1="360" y1="642" x2="360" y2="716" stroke="#e2e8f0" stroke-width="2"/>
    <text x="410" y="678" class="metric">72,892</text>
    <text x="410" y="708" class="metricLabel">orders loaded</text>
    <line x1="690" y1="642" x2="690" y2="716" stroke="#e2e8f0" stroke-width="2"/>
    <text x="740" y="678" class="metric">6</text>
    <text x="740" y="708" class="metricLabel">dbt models</text>
    <line x1="950" y1="642" x2="950" y2="716" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1000" y="678" class="metric">28</text>
    <text x="1000" y="708" class="metricLabel">data tests passed</text>
    <line x1="1260" y1="642" x2="1260" y2="716" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1310" y="678" class="metric">01:28</text>
    <text x="1310" y="708" class="metricLabel">Airflow DAG run</text>
  </g>

  <rect x="80" y="784" width="1440" height="62" rx="8" fill="#0f172a"/>
  <text x="112" y="823" style="font:600 16px Inter,Arial,sans-serif;fill:#e2e8f0">Versioned in GitHub</text>
  <text x="318" y="823" style="font:400 16px Inter,Arial,sans-serif;fill:#94a3b8">SQL setup · Python loader · dbt models + tests · Airflow DAG · evidence</text>
</svg>
